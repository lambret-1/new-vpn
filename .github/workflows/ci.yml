name: 快速打包

# 触发条件：推送 main 分支、打 tag、手动触发
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号进位方式"
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major, none]

# 权限：需要写入内容以创建 Release 和打 tag
permissions:
  contents: write

# 并发控制：main 分支只跑最新一次，tag 不取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: 编译未签名 IPA
    runs-on: macos-14

    defaults:
      run:
        shell: zsh -e {0}

    env:
      PROJECT_NAME: NewVPN
      SCHEME: NewVPN
      BUILD_DIR: build
      CONFIGURATION: Release

    steps:
      # ── 1. 拉取代码 ──
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 选择 Xcode 版本 ──
      - name: 选择 Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 验证 Xcode 版本
        run: xcodebuild -version

      # ── 3. 缓存 XcodeGen 二进制 ──
      - name: 缓存 XcodeGen
        id: cache-xcodegen
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xcodegen
          key: xcodegen-2.42.0

      # ── 4. 安装 XcodeGen（缓存未命中时）──
      - name: 安装 XcodeGen
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -o /tmp/xcodegen.zip -d /tmp/xcodegen-bin
          sudo cp /tmp/xcodegen-bin/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      # ── 5. 下载预编译的 libbox.xcframework ──
      - name: 下载 libbox 框架
        run: |
          mkdir -p Frameworks
          echo "下载 sing-box libbox v1.11.0..."
          gh release download singbox-v1.11.0 -p "libbox-ios-v1.11.0.zip" -D /tmp/ --repo lambret-1/new-vpn 2>&1 || {
            echo "下载失败，尝试使用 curl..."
            curl -L -o /tmp/libbox-ios-v1.11.0.zip \
              "https://github.com/lambret-1/new-vpn/releases/download/singbox-v1.11.0/libbox-ios-v1.11.0.zip"
          }
          unzip -o /tmp/libbox-ios-v1.11.0.zip -d Frameworks/
          echo "框架下载完成"
          if [ -d "Frameworks/Libbox.xcframework" ]; then
            echo "使用 Libbox.xcframework（大写）"
            ls -la Frameworks/Libbox.xcframework
          elif [ -d "Frameworks/libbox.xcframework" ]; then
            echo "使用 libbox.xcframework（小写，旧版）"
            ls -la Frameworks/libbox.xcframework
          else
            echo "错误：未找到框架目录"
            ls -la Frameworks/
            exit 1
          fi

      # ── 6. 生成 Xcode 工程 ──
      - name: 生成 Xcode 工程
        run: xcodegen generate

      # ── 6. 安装 SwiftLint ──
      - name: 安装 SwiftLint
        run: |
          brew install swiftlint 2>/dev/null || true
          swiftlint version || echo "SwiftLint 安装跳过"

      # ── 7. 代码规范检查 ──
      - name: SwiftLint 代码检查
        run: |
          if command -v swiftlint &>/dev/null; then
            swiftlint lint --reporter github-actions-logging
          else
            echo "SwiftLint 不可用，跳过检查"
          fi

      # ── 8. 计算版本号 ──
      - name: 计算版本号
        id: version
        run: |
          # 先获取最新的 tag（确保能获取到之前 CI 创建的 tag）
          git fetch --tags --force
          # 刷新本地 tag 列表
          git tag -l > /dev/null

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # tag 触发：直接使用 tag 版本号，不进位
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "版本来源: git tag ${GITHUB_REF_NAME}"
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            # push / 手动触发：从最近 tag 读取版本并进位
            # 按版本号排序获取最新 tag（creatordate 排序不可靠）
            LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            fi
            CURRENT="${LATEST_TAG#v}"
            CURRENT=${CURRENT:-0.1.0}

            echo "获取到的最新 tag: $LATEST_TAG"

            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            PATCH=$(echo $CURRENT | cut -d. -f3)

            BUMP="${{ github.event.inputs.bump }}"
            BUMP=${BUMP:-patch}

            case $BUMP in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
              none) ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "基准版本: v${CURRENT}"
            echo "进位方式: ${BUMP}"
            echo "新版本: v${NEW_VERSION}"
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      # ── 9. 写入版本号到 Info.plist ──
      - name: 写入版本号到 Info.plist
        run: |
          INFO_PLIST="${{ env.PROJECT_NAME }}.xcodeproj/../Sources/AppMain/Info.plist"
          # 兼容 XcodeGen 生成的 Info.plist 路径
          if [ ! -f "$INFO_PLIST" ]; then
            INFO_PLIST=$(find . -name "Info.plist" -path "*/AppMain/*" | head -1)
          fi
          echo "Info.plist 路径: $INFO_PLIST"

          # 写入版本号（CFBundleShortVersionString）
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ steps.version.outputs.version }}" "$INFO_PLIST"

          # 写入构建号（CFBundleVersion）
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$INFO_PLIST"

          # 验证写入结果
          echo "写入后版本号:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"

      # ── 10. 编译归档（通过参数设置版本号和构建号）──
      - name: 编译归档
        run: |
          rm -rf ${{ env.BUILD_DIR }}
          mkdir -p ${{ env.BUILD_DIR }}

          xcodebuild archive \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination "generic/platform=iOS" \
            -archivePath ${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}.xcarchive \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      # ── 11. 验证归档内版本号 ──
      - name: 验证归档版本号
        run: |
          APP_INFO_PLIST="${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}.xcarchive/Products/Applications/${{ env.PROJECT_NAME }}.app/Info.plist"
          if [ -f "$APP_INFO_PLIST" ]; then
            echo "归档内 Info.plist 版本号:"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO_PLIST"
          else
            echo "警告：未找到归档内 Info.plist"
          fi

      # ── 12. 手动打包未签名 IPA（不使用 exportArchive，避免 Team 要求）──
      - name: 打包未签名 IPA
        run: |
          # 从归档中提取 .app
          APP_PATH=$(find ${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}.xcarchive/Products/Applications -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "错误：未找到 .app 文件"
            exit 1
          fi
          echo "找到应用: $APP_PATH"

          # 安装 ldid 用于嵌入 entitlements（未签名构建需要手动嵌入）
          brew install ldid 2>/dev/null || true

          # 嵌入主 App entitlements
          if [ -f "Sources/AppMain/NewVPN.entitlements" ]; then
            echo "嵌入主 App entitlements..."
            ldid -S"Sources/AppMain/NewVPN.entitlements" "$APP_PATH/${{ env.PROJECT_NAME }}"
          fi

          # 嵌入 Tunnel Extension entitlements
          PLUGINS_PATH="$APP_PATH/PlugIns"
          if [ -d "$PLUGINS_PATH" ]; then
            for EXTENSION in "$PLUGINS_PATH"/*.appex; do
              if [ -d "$EXTENSION" ]; then
                EXT_NAME=$(basename "$EXTENSION" .appex)
                EXT_BINARY="$EXTENSION/$EXT_NAME"
                if [ -f "Sources/TunnelExtension/NewVPN-Tunnel.entitlements" ] && [ -f "$EXT_BINARY" ]; then
                  echo "嵌入 $EXT_NAME entitlements..."
                  ldid -S"Sources/TunnelExtension/NewVPN-Tunnel.entitlements" "$EXT_BINARY"
                fi
              fi
            done
          fi

          # 创建 IPA 目录结构
          mkdir -p ${{ env.BUILD_DIR }}/ipa/Payload
          cp -R "$APP_PATH" ${{ env.BUILD_DIR }}/ipa/Payload/

          # 移除代码签名相关文件（未签名 IPA）
          find ${{ env.BUILD_DIR }}/ipa/Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find ${{ env.BUILD_DIR }}/ipa/Payload -name "embedded.mobileprovision" -delete 2>/dev/null || true

          # 打包为 IPA
          cd ${{ env.BUILD_DIR }}/ipa
          zip -qr ../NewVPN-unsigned.ipa Payload
          cd -
          echo "IPA 打包完成"
          ls -lh ${{ env.BUILD_DIR }}/NewVPN-unsigned.ipa

      # ── 13. 验证 IPA 产物 ──
      - name: 验证 IPA 产物
        run: |
          IPA_PATH="${{ env.BUILD_DIR }}/NewVPN-unsigned.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "错误：未找到 IPA 文件"
            exit 1
          fi
          SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH" 2>/dev/null)
          if [ "$SIZE" -lt 100000 ]; then
            echo "错误：IPA 文件过小（${SIZE} 字节），可能构建异常"
            exit 1
          fi
          echo "IPA 验证通过: ${IPA_PATH} (${SIZE} 字节)"

      # ── 14. 重命名 IPA（命名规范：newVPN-vX.Y.Z.ipa）──
      - name: 重命名 IPA
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          cp "${{ env.BUILD_DIR }}/NewVPN-unsigned.ipa" "${{ env.BUILD_DIR }}/newVPN-${VERSION}.ipa"
          ls -lh "${{ env.BUILD_DIR }}/newVPN-${VERSION}.ipa"

      # ── 15. 上传构建产物 ──
      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: newVPN-v${{ steps.version.outputs.version }}
          path: ${{ env.BUILD_DIR }}/newVPN-v${{ steps.version.outputs.version }}.ipa
          retention-days: 90

      # ── 16. 自动创建 Release（push main 和 tag 均触发）──
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: newVPN v${{ steps.version.outputs.version }}
          body: |
            ## newVPN v${{ steps.version.outputs.version }}

            **构建信息**
            - 版本：v${{ steps.version.outputs.version }}
            - 构建号：${{ github.run_number }}
            - 构建环境：Xcode 15.4 / macOS 14
            - 最低支持：iOS 16.0
            - 产物：未签名 IPA（需自签名或侧载安装）
            - 提交：${{ github.sha }}

            **安装说明**
            1. 下载下方 IPA 文件
            - 使用 AltStore / Sideloadly 等工具侧载安装
            - 或使用企业证书签名后安装
          files: |
            ${{ env.BUILD_DIR }}/newVPN-v${{ steps.version.outputs.version }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
