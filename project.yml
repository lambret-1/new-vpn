# XcodeGen 工程描述文件
# 使用方式：xcodegen generate

name: NewVPN

options:
  bundleIdPrefix: com.newvpn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

# 主 App target
targets:
  NewVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/AppMain
        excludes:
          - "**/README.md"
    # Info.plist 配置（XcodeGen 自动生成）
    info:
      path: Sources/AppMain/Info.plist
      properties:
        CFBundleDisplayName: NewVPN
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 用于局域网连接检测
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.newvpn.app.subscriptionRefresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newvpn.app
        PRODUCT_NAME: NewVPN
        CODE_SIGN_ENTITLEMENTS: Sources/AppMain/NewVPN.entitlements
    dependencies:
      - target: NewVPN-Tunnel

  # PacketTunnel 扩展 target
  NewVPN-Tunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/TunnelExtension
        excludes:
          - "**/README.md"
    # 扩展 Info.plist 配置
    info:
      path: Sources/TunnelExtension/Info.plist
      properties:
        CFBundleDisplayName: NewVPN-Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newvpn.app.tunnel
        PRODUCT_NAME: NewVPN-Tunnel
        CODE_SIGN_ENTITLEMENTS: Sources/TunnelExtension/NewVPN-Tunnel.entitlements
        # 启用模块（libbox头文件使用@import）
        CLANG_ENABLE_MODULES: YES
        # OC-Swift 桥接头
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TunnelExtension/NewVPN-Tunnel-Bridging-Header.h
        # 框架搜索路径
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Frameworks
        # 链接 libbox 框架
        OTHER_LDFLAGS: -framework Libbox
    dependencies:
      - sdk: NetworkExtension.framework
      - framework: Frameworks/Libbox.xcframework

# Scheme
schemes:
  NewVPN:
    build:
      targets:
        NewVPN: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
