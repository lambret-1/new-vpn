# XcodeGen 工程描述文件
# 使用方式：xcodegen generate

name: NewVPN

options:
  bundleIdPrefix: com.newvpn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

# 主 App  targets
targets:
  NewVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/AppMain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newvpn.app
        PRODUCT_NAME: NewVPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于局域网连接检测
    dependencies:
      - target: NewVPN-Tunnel

  # PacketTunnel 扩展
  NewVPN-Tunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/TunnelExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newvpn.tunnel
        PRODUCT_NAME: NewVPN-Tunnel
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
    dependencies:
      - s: NetworkExtension

# Scheme
schemes:
  NewVPN:
    build:
      targets:
        NewVPN: all
    test:
      targets:
        - NewVPNTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
